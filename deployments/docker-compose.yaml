version: '3.9'

name: triplayz

services:
  app:
    build: 
      context: ..
      dockerfile: deployments/Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ../.env
  
  consumer:
    build: 
      context: ..
      dockerfile: deployments/Dockerfile.api
    ports:
      - "8002:8000"
    depends_on:
      - redis
    env_file:
      - ../.env

  websocket:
    build: 
      context: ..
      dockerfile: deployments/Dockerfile.websocket
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ../.env

  db:
    image: postgres:latest
    restart: "always"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../.env

  adminer:
    image: adminer:4.8.1
    restart: "always"
    ports:
      - "8765:8080"
    depends_on:
      - db
  
  redis:
    image: "redis:alpine"
    restart: "always"
    ports:
      - "6379:6379"
    volumes:
      - ./tmp/rd:/data

volumes:
  postgres_data: